<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Martin Šuba – CV</title>
		<link rel="canonical" href="https://martinsuba.github.io/cv/" />
		<meta http-equiv="refresh" content="0; url=/cv/" />
		<meta name="robots" content="noindex" />
		<script>
			// Remove the service worker of the old site (it was registered at scope "/"), then redirect.
			(async () => {
				try {
					const regs = (await navigator.serviceWorker?.getRegistrations?.()) ?? [];
					await Promise.all(regs.map((r) => r.unregister()));
				} catch (e) {}
				location.replace('/cv/');
			})();
		</script>
	</head>
	<body>
		<p>Moved to <a href="/cv/">martinsuba.github.io/cv/</a>.</p>
	</body>
</html>
